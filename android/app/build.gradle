import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.android_app"
    compileSdk = 36
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.android_app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // 只打包 arm64-v8a（64 位 ARM），移除 armeabi-v7a / x86_64，减小 APK 体积。
        // 注意：APK 仅能安装到 64 位 ARM 设备（绝大多数现代手机），
        // 无法安装到 32 位-only 设备或 x86 模拟器。
        // 配合 android/gradle.properties 中的 disable-abi-filtering=true，阻止 Flutter
        // Gradle 插件把 defaultConfig.ndk.abiFilters 重置为全平台（否则会被覆盖、打出胖 APK）。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("key.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            def defaultStoreFile = "${System.getProperty('user.home')}/.android/debug.keystore"
            def storeFilePath = keystoreProperties.getProperty('storeFile', defaultStoreFile)?.trim()
            if (storeFilePath) {
                storeFile file(storeFilePath)
            } else {
                storeFile file(defaultStoreFile)
            }
            keyAlias keystoreProperties.getProperty('keyAlias', 'androiddebugkey')
            keyPassword keystoreProperties.getProperty('keyPassword', 'android')
            storePassword keystoreProperties.getProperty('storePassword', 'android')
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
