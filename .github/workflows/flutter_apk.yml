name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/flutter_apk.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Verify Flutter SDK
        run: |
          flutter config --no-analytics
          flutter --version
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> $GITHUB_ENV

      # 不使用 android-actions/setup-android@v3：其内部会执行已废弃的
      # `sdkmanager tools`（旧 SDK "tools" 包），而新装上的 cmdline-tools 16.0
      # 已移除该包，导致 "Failed to find package 'tools'" 退出码 1、整步失败、
      # 后续全部被 skip。改为手动安装，完全可控。
      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125"

      - name: Parse version from pubspec
        id: version
        shell: bash
        run: |
          # 以 pubspec.yaml 的 version 为唯一版本来源（如 1.0.8），
          # 避免此前硬编码 1.0.2/3 导致"已安装版本"与发布 tag 不一致、更新检测失效。
          VER=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          # versionCode 采用 X*10000 + Y*100 + Z，保证正常版本递进时单调递增（Android 要求升级时 versionCode 增大）。
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "解析到版本 versionName=$VER versionCode=$VERSION_CODE"

      - name: Generate local.properties
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          cat > android/local.properties <<EOF
          sdk.dir=$SDK_ROOT
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=release
          flutter.versionName=${{ steps.version.outputs.version_name }}
          flutter.versionCode=${{ steps.version.outputs.version_code }}
          EOF

      - name: Set up Android signing config
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using signing key from GitHub Secrets"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android-signing/release.keystore"
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/android-signing/release.keystore
          EOF
          else
            echo "WARNING: No signing secrets configured, generating temporary debug key"
            keytool -genkeypair \
              -v \
              -keystore "$RUNNER_TEMP/android-signing/debug.keystore" \
              -storetype JKS \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cat > android/key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$RUNNER_TEMP/android-signing/debug.keystore
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Check if release tag already exists
        id: tagcheck
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version_name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "标签 $TAG 已存在，跳过重复发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release with APK
        if: github.event_name != 'pull_request' && steps.tagcheck.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2.2.2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: 二级建造师学习助手 v${{ steps.version.outputs.version_name }}
          body: |
            Automated APK build from commit ${{ github.sha }}.
            版本：v${{ steps.version.outputs.version_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
